inimal","pagesCount":1,"pages":["https://www.mongodb.com/user-research"],"thumb":"thumbs/cards_minimal_dark_8.jpg"},{"variantId":"carousel-minimal-dark-13","baseBlock":"carousel","structure":"heading + text + 10 CTAs","colorScheme":"dark","density":"minimal","pagesCount":1,"pages":["https://www.mongodb.com/user-research"],"thumb":"thumbs/carousel_minimal_dark_13.jpg"}];
const EXISTING = new Set(["hero","columns","cards","form","header","footer","fragment"]);
const bases = ["columns","hero","cards","form","footer","header","quote","carousel","tabs","accordion","video","embed","search","unknown"];
const byBase = {"footer":{"variants":1,"pageUses":1},"header":{"variants":1,"pageUses":1},"carousel":{"variants":27,"pageUses":35},"hero":{"variants":27,"pageUses":826},"unknown":{"variants":95,"pageUses":1341},"form":{"variants":12,"pageUses":29},"quote":{"variants":73,"pageUses":718},"columns":{"variants":33,"pageUses":520},"cards":{"variants":21,"pageUses":97},"accordion":{"variants":7,"pageUses":21},"video":{"variants":6,"pageUses":14},"tabs":{"variants":18,"pageUses":83},"embed":{"variants":1,"pageUses":1},"search":{"variants":1,"pageUses":1}};
let activeBase = null, query = "";
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function kind(b){ return b==="unknown" ? "none" : (EXISTING.has(b) ? "exist" : "new"); }
function kindLabel(b){ return b==="unknown" ? "NOT a block — default content / mis-detected regions" : (EXISTING.has(b) ? "existing block" : "NEW block to build"); }
function renderChips(){
  const el = document.getElementById("chips"); el.innerHTML = "";
  const all = document.createElement("span");
  all.className = "chip" + (activeBase===null?" active":"");
  all.innerHTML = "All <span class=n>"+DATA.length+"</span>";
  all.onclick = ()=>{ activeBase=null; render(); }; el.appendChild(all);
  for (const b of bases){
    const c = document.createElement("span"); const k = kind(b);
    c.className = "chip" + (activeBase===b?" active":"");
    c.innerHTML = esc(b) + " <span class=n>"+byBase[b].variants+"</span>";
    c.style.borderColor = k==="new" ? "#f0a980" : (k==="none" ? "#e0cf88" : "#a9d3b6");
    c.onclick = ()=>{ activeBase = (activeBase===b?null:b); render(); }; el.appendChild(c);
  }
}
function matches(v){
  if (activeBase && v.baseBlock !== activeBase) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  return v.variantId.toLowerCase().includes(q) || (v.structure||"").toLowerCase().includes(q) || v.baseBlock.toLowerCase().includes(q) || v.pages.some(p=>p.toLowerCase().includes(q));
}
function render(){
  renderChips();
  const main = document.getElementById("main"); main.innerHTML = "";
  const shown = DATA.filter(matches);
  const groups = {};
  for (const v of shown) (groups[v.baseBlock]=groups[v.baseBlock]||[]).push(v);
  const order = bases.filter(b=>groups[b]);
  if (!order.length){ main.innerHTML = "<p style=color:#888>No variants match.</p>"; return; }
  for (const b of order){
    const k = kind(b);
    const hdr = document.createElement("div"); hdr.className = "grouphdr";
    hdr.innerHTML = "<span class=\"tag-"+k+"\">"+esc(b)+"</span> <span class=meta>"+groups[b].length+" variants · "+groups[b].reduce((a,v)=>a+v.pagesCount,0)+" page-uses · "+kindLabel(b)+"</span>";
    main.appendChild(hdr);
    if (b==="unknown"){
      const note = document.createElement("div"); note.className = "note";
      note.innerHTML = "These \"unknown\" variants are NOT bespoke blocks. They are regions the detector could not match to a known block — mostly <b>default content</b>, <b>repeating grid items counted individually</b> (→ existing <code>cards</code>), or regions it could not introspect. See FINDINGS.md in the parent folder.";
      main.appendChild(note);
    }
    const grid = document.createElement("div"); grid.className = "grid";
    for (const v of groups[b].sort((a,b)=>b.pagesCount-a.pagesCount)){
      const card = document.createElement("div"); card.className = "card";
      const thumb = v.thumb ? "<div class=thumb><img loading=lazy src=\""+esc(v.thumb)+"\"></div>" : "<div class=\"thumb empty\">no screenshot</div>";
      const pagesList = v.pages.map(p=>"<li><a href=\""+esc(p)+"\" target=_blank>"+esc(p.replace(/^https?:\/\/www\.mongodb\.com/,""))+"</a></li>").join("");
      card.innerHTML = thumb + "<div class=body>" +
          "<div class=vid>"+esc(v.variantId)+"</div>" +
          "<div class=attrs>"+esc([v.structure, v.colorScheme, v.density].filter(Boolean).join(" · "))+"</div>" +
          "<div class=count>"+v.pagesCount+" page"+(v.pagesCount===1?"":"s")+"</div>" +
          (v.pages.length? "<details><summary>show pages</summary><ul>"+pagesList+"</ul></details>":"") +
        "</div>";
      grid.appendChild(card);
    }
    main.appendChild(grid);
  }
}
document.getElementById("q").addEventListener("input", e=>{ query = e.target.value.trim(); render(); });
render();
</script>
